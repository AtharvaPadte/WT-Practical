<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h2 class="logo">CarWorld</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#brands">Top Brands</a></li>
            <li><a href="#models">Popular models</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to Car World</h1>
    <p>Explore the world of cars</p>
    <button onclick="showMessage()">Click to explore</button>
</section>

<section id="brands" class="section">
    <h2>Top Brands</h2>
    <div class="cards">
        <div class="card">Porsche</div>
        <div class="card">Maserati</div>
        <div class="card">Mercedes</div>
        <div class="card">Lamborghini</div>
    </div>
</section>

<section id="models" class="section">
    <h2>Popular Models</h2>
    <ul id="ModelsList"></ul>
</section>

<footer id="contact">
    <p>CarWorld © 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
